[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semwave"
version = "0.1.0"
description = "2-D spectral-element elastodynamics on random media, with a Lemaitre-Chaboche visco-plastic layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
# dolfinx is not on PyPI: install it with conda/apt or use the FEniCSx image
plots = ["matplotlib>=3.5"]

[tool.setuptools]
packages = ["semwave"]
